<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4 L5 A3</title>
</head>
<body>
    <p id="result"></p>

    <script>
        function add(a, b, c) {
            return a + b + c;
        }

        function average(a, b, c) {
            return add(a, b, c) / 3;
        }

        let result = average(10000000, 100000000, 10000000);

        document.getElementById("result").innerHTML = result;
    </script>
</body>
</html>
