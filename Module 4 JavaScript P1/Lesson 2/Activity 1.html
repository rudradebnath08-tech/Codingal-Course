<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4 L2 - Intro To Functions</title>
</head>

<body>

    <button onclick="sum(99,1)">
        Click Me!
    </button>

    <p id="result"></p>

    <script>
        function sum(a, b) {
            let sum = a + b;
            document.getElementById("result").innerHTML = sum;
        }

        sum(105, 220);
    </script>

</body>

</html>
