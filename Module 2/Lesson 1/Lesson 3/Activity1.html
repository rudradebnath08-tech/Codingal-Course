<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 2 - Lesson 3 Activity 1 - My Superhero Card</title>
    <style>
        /* Typography — font, size, weight, colour for the whole page */
        body{
            background-color: blue;
            color: white;
            font-family: Arial, sans-serif;
        }



        /* Typography + Text Shadow — big bold title with an orange shadow */
        .hero-name{
           .california {
    background: #1a0a0a;
    color: tomato;
    text-shadow:
        0 0 10px orangered,
        0 0 20px firebrick,
        0 0 40px maroon,
        0 0 80px darkred;
    filter: saturate(60%);
    animation: flicker steps(100) 3s 3s infinite;
    font-family: 'Marck Script', cursive;
}

@keyframes flicker {
    50% {
        color: white;
        filter: saturate(200%) hue-rotate(20deg);
    }
}
        }



        /* Typography + Text Transform — tagline becomes Title Case */
        .tagline{
            font-style: italic;
            color: coral;
            text-transform: capitalize;
        }



        /* Text Transform + Text Decoration — section headings in CAPS with underline */
        .label{
            text-transform: uppercase;
            text-decoration: underline;
            color: purple;
        }



        /* Typography — powers stand out in bold green */
        .power{
            font-weight: bold;
            color: lime;
        }



        /* Text Decoration — weaknesses are crossed out */
        .weakness{
            text-decoration: line-through;
            color: gray;
        }



        /* Transform — the badge is tilted to the side */
        .badge{
            font-size: 28px;
            font-weight: bold;
            color: black;
            transform: rotate(15deg);
            background-color: yellow;
            display: inline-block;
        }



        /* Typography — footer text */
        .footer {
            font-style: italic;
            color: coral;
        }
    </style>
</head>

<body>
    <h1 class="hero-name">Thunder Kid</h1>
    <p class="tagline">The most powerful hero in the school</p>

    <h2 class="label">Super powers</h2>
    <p class="power">Can run faster than a cheetah</p>
    <p class="power">Can lift a school bus</p>

    <h2 class="label">Weaknesses</h2>
    <p class="weakness">Maths homework</p>
    <p class="weakness">Broccoli</p>

    <div class="badge">Top Hero</div>

    <p class="made-by">Created by Rudra Debnath</p>
</body>

</html>
