<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P5-JS</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            min-height: 100vh;
        }
        h2 {
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 255, 255, 0.3);
            font-size: 2.5em;
            text-align: center;
            margin-bottom: 30px;
        }
        #output {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            font-size: 1.1em;
            line-height: 1.8;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
        }
        .output-line {
            margin: 10px 0;
            font-weight: 500;
        }
        .line1 {
            color: #e74c3c;
            text-shadow: 1px 1px 2px rgba(231, 76, 60, 0.2);
        }
        .line2 {
            color: #3498db;
            text-shadow: 1px 1px 2px rgba(52, 152, 219, 0.2);
        }
        .line3 {
            color: #2ecc71;
            text-shadow: 1px 1px 2px rgba(46, 204, 113, 0.2);
        }
        .line4 {
            color: #f39c12;
            text-shadow: 1px 1px 2px rgba(243, 156, 18, 0.2);
        }
        .line5 {
            color: #9b59b6;
            text-shadow: 1px 1px 2px rgba(155, 89, 182, 0.2);
        }
    </style>
</head>
<body>
    <h2>JS Objects Data Structure</h2>
    <div id="output"></div>

    <script>
        var student = {
            name: 'Rahul',
            age: '12',
            Grade: '7',
            hobbies: 'Drawing',
            fav_sport: 'Cricket'
        };

        var color = ["white", "black", "red", "green", "blue"];
        
        var output = document.getElementById('output');
        
        var line1 = '<div class="output-line line1">Student name is : ' + student.name + '</div>';
        var line2 = '<div class="output-line line2">Student favorite sport is : ' + student.fav_sport + '</div>';
        var line3 = '<div class="output-line line3">Before Poping the colors are: ' + color.join("^") + '</div>';
        var line4 = '<div class="output-line line4">My favorite color is : ' + color[3] + '</div>';
        
        color.pop();
        
        var line5 = '<div class="output-line line5">After Poping the colors are : ' + color.join("*") + '</div>';
        
        output.innerHTML = line1 + line2 + line3 + line4 + line5;
    </script>
</body>
</html>
