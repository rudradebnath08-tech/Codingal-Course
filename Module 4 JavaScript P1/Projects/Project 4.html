<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Favourite Person Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap');

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        h1 {
            color: #fff;
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            font-weight: 700;
            text-shadow: 3px 3px 8px rgba(0, 0, 0, 0.3), 0px 0px 20px rgba(255, 255, 255, 0.2);
            letter-spacing: -1px;
            margin-bottom: 0.5rem !important;
        }

        .text-muted {
            color: rgba(255, 255, 255, 0.85) !important;
            font-size: 1.1rem;
            font-weight: 500;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .card {
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.95) !important;
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25) !important;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35) !important;
        }

        .card-body {
            padding: 2rem;
        }

        .card-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #667eea !important;
            text-shadow: 1px 1px 3px rgba(102, 126, 234, 0.1);
            margin-bottom: 1.5rem;
        }

        .card h6 {
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            color: #764ba2 !important;
            text-shadow: 1px 1px 2px rgba(118, 75, 162, 0.1);
            font-size: 1.1rem;
        }

        .list-group-item {
            border: none;
            border-bottom: 1px solid rgba(102, 126, 234, 0.1) !important;
            padding: 1.2rem 0;
            background: transparent !important;
        }

        .list-group-item:last-child {
            border-bottom: none !important;
        }

        .card-label {
            font-size: 10px;
            color: #667eea;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-shadow: 1px 1px 2px rgba(102, 126, 234, 0.05);
        }

        .list-group-item strong {
            color: #333;
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            display: block;
            margin-top: 0.5rem;
        }

        pre {
            font-size: 13px;
            color: #333;
            font-family: 'Monaco', 'Courier New', monospace;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%) !important;
            border: 1px solid rgba(102, 126, 234, 0.2) !important;
            border-radius: 12px;
            overflow-x: auto;
        }

        .bg-light {
            background: transparent !important;
        }
    </style>
</head>

<body class="py-4">

    <div class="container d-flex flex-column align-items-center">

        <h1 class="mb-1 text-center">My Favourite Person Profile</h1>
        <p class="text-muted mb-4 text-center">
            Introduction to Objects in JavaScript
        </p>

        <!-- Profile Card -->
        <div class="card shadow-sm mb-3" style="max-width:400px;">
            <div class="card-body">
                <h5 class="card-title" style="color:#FF5A43;">Profile Details</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                        <span class="card-label d-block">Name</span>
                        <strong id="name">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">Relationship</span>
                        <strong id="relationship">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">Favourite Activity</span>
                        <strong id="activity">-</strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">City</span>
                        <strong id="city">-</strong>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Code Box -->
        <div class="card shadow-sm" style="max-width:400px;">
            <div class="card-body">
                <h6 style="color:#FF5A43;">JavaScript Object Used</h6>
                <pre id="codeDisplay" class="bg-light p-3 rounded border mb-0"></pre>
            </div>
        </div>

    </div><!-- /container -->

    <script>

        // Step 1 - Create the favourite person object
        var favouritePerson = {
            name: "Rudra Debnath",
            relationship: "Myself",
            activity: "Playing Football",
            city: "Delhi"
        };

        // Step 2 - Dot notation
        var nameEl = document.getElementById("name");
        var relationshipEl = document.getElementById("relationship");
        nameEl.textContent = favouritePerson.name;
        relationshipEl.textContent = favouritePerson.relationship;

        // Step 3 - Bracket notation
        var activityEl = document.getElementById("activity");
        var cityEl = document.getElementById("city");
        activityEl.textContent = favouritePerson["activity"];
        cityEl.textContent = favouritePerson["city"];

        // Show the object in the code box
        var codeEl = document.getElementById("codeDisplay");
        codeEl.textContent =
            'var favouritePerson = {\n' +
            '  name:         "' + favouritePerson.name + '",\n' +
            '  relationship: "' + favouritePerson.relationship + '",\n' +
            '  activity:     "' + favouritePerson["activity"] + '",\n' +
            '  city:         "' + favouritePerson["city"] + '"\n' +
            '};';

    </script>

</body>

</html>
