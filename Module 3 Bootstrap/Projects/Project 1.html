<!DOCTYPE html>
<html>

<head>
    <title>School Club Website</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            padding: 30px 15px;
        }

        h1 {
            text-align: center;
            color: forestgreen;
        }

        .club-card {
            text-align: center;
            border: 2px solid green;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff8e1;
        }

        .club-card h3 {
            color: darkgreen;
        }

        .img1 {
            position: absolute;
            right: 50px;
            left: 362px;
            bottom: 30px;
        }
    </style>
</head>

<body>

    <h1>My School Clubs</h1>
    <div class="container">

        <div class="row">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Coding Club</h3>
                    <p>We learn how to create websites, games, and simple apps.</p>
                     
                    <div class="img">
                        <img src="Coding.png" alt="Coding ninja's in action" width="300" height="200">
                    </div>


                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="club-card">
                    <h3>Science Club</h3>
                    <p>We enjoy doing experiments and discovering how things work.</p>

                    <div class="img">
                        <img src="Science.png" alt="Science experiment in progress" width="300" height="200">
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-12 col-lg-4">
                <div class="club-card">
                    <h3>Art Club</h3>
                    <p>We love drawing, painting, and creating colourful designs.</p>
                    
                    <div class="img">
                        <img src="Art.png" alt="Artistic creation in progress" width="300" height="200">
                    </div>
                </div>
            </div>

            <div class="img1">
                <img src="College.png" alt="College campus" width="600" height="220">
            </div>

        </div>
    </div>

    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>

</body>

</html>
