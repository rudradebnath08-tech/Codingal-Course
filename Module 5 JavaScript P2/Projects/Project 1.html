<!DOCTYPE html>
<html>

<head>
    <title>My Birthday Countdown Checker</title>


    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Pacifico&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --accent: #ff477e;
            --accent-2: #6a5cff;
            --card: #ffffff;
            --muted: #4b3b3b;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: linear-gradient(120deg, #ffd6e0, #fff2b2, #d6f7ff);
            background-size: 300% 300%;
            animation: bgShift 12s ease infinite;
            color: var(--muted);
            text-align: center;
            margin: 0;
            padding: 30px 10px;
        }

        @keyframes bgShift {
            0% {
                background-position: 0% 50%
            }

            50% {
                background-position: 100% 50%
            }

            100% {
                background-position: 0% 50%
            }
        }


        .birthday-card {
            width: min(560px, 92%);
            background-color: var(--card);
            border: 4px solid var(--accent);
            border-radius: 22px;
            margin: 30px auto;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(106, 92, 255, 0.12);
            transform: translateY(0);
            animation: floaty 6s ease-in-out infinite;
        }

        @keyframes floaty {
            0% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-10px)
            }

            100% {
                transform: translateY(0)
            }
        }


        h1 {
            color: var(--accent-2);
            font-size: 34px;
            margin: 6px 0 12px 0;
            font-family: 'Pacifico', cursive;
            text-shadow: 0 2px 6px rgba(106, 92, 255, 0.15);
        }


        .emoji {
            font-size: 64px;
            margin-bottom: 6px;
            animation: bounce 1.6s ease infinite;
        }

        @keyframes bounce {
            0% {
                transform: translateY(0)
            }

            30% {
                transform: translateY(-14px)
            }

            60% {
                transform: translateY(0)
            }

            100% {
                transform: translateY(0)
            }
        }


        .info-box {
            background: linear-gradient(180deg, rgba(255, 244, 250, 0.9), rgba(246, 250, 255, 0.9));
            border: 1px dashed rgba(106, 92, 255, 0.12);
            border-radius: 12px;
            padding: 14px 16px;
            margin-top: 14px;
            text-align: left;
            transition: transform .35s ease, box-shadow .35s ease;
        }

        .info-box:hover {
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(106, 92, 255, 0.06)
        }


        button {
            background-image: linear-gradient(90deg, var(--accent), var(--accent-2));
            color: white;
            border: none;
            border-radius: 28px;
            padding: 12px 26px;
            font-size: 18px;
            cursor: pointer;
            font-weight: 700;
            box-shadow: 0 8px 20px rgba(106, 92, 255, 0.12);
            transition: transform .18s ease, box-shadow .18s ease;
        }


        button:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 34px rgba(106, 92, 255, 0.18)
        }


        #daysBox {
            font-size: 46px;
            font-weight: 800;
            color: var(--accent-2);
            letter-spacing: 1px;
        }


        #result {
            font-size: 16px;
            line-height: 1.6;
            color: #3b3b3b;
        }


        #countdown {
            color: var(--accent);
            font-weight: 600;
            line-height: 1.6;
        }

        @media (prefers-reduced-motion: reduce) {

            .birthday-card,
            .emoji {
                animation: none
            }

            body {
                animation: none
            }
        }
    </style>
</head>


<body>


    <div class="birthday-card">


        <div class="emoji">Birthday Time</div>


        <h1>My Birthday Countdown Checker</h1>


        <p>
            Click the button to check how many days are left for the birthday celebration.
        </p>


        <button onclick="checkBirthday()">Check Birthday Countdown</button>


        <h2>Days Left</h2>
        <div id="daysBox">?</div>


        <div class="info-box">
            <h2>Birthday Result</h2>
            <p id="result"></p>
        </div>


        <div class="info-box">
            <h2>Countdown Review</h2>
            <p id="countdown"></p>
        </div>


    </div>


    <script>
        function checkBirthday() {


            // Null and Undefined
            let birthdayGift = null;
            let birthdayPlan;


            // Block Scope using let and const
            const studentName = "Rudra Debnath";
            const birthdayMonth = 6;
            const birthdayDate = 17;


            let message = "";
            let countdownText = "";


            // The Date Object
            let today = new Date();
            let currentYear = today.getFullYear();


            let birthday = new Date(currentYear, birthdayMonth - 1, birthdayDate);


            // Comparison Operator with if statement
            if (birthday < today) {
                birthday = new Date(currentYear + 1, birthdayMonth - 1, birthdayDate);
            }


            let timeDifference = birthday - today;
            let daysLeft = Math.ceil(timeDifference / (1000 * 60 * 60 * 24));


            // Comparison Operators and if/else Conditional Statements
            if (daysLeft === 0) {
                message = "Happy Birthday, " + studentName + "! Today is your special day!";
            } else if (daysLeft <= 7) {
                message = "Your birthday is almost here, " + studentName + "!";
            } else {
                message = "Keep counting, " + studentName + "! Your birthday is coming soon.";
            }


            // String Concatenation
            let finalMessage = "Student Name: " + studentName + "<br>";
            finalMessage = finalMessage + "Today's Date: " + today.toDateString() + "<br>";
            finalMessage = finalMessage + "Birthday Date: " + birthday.toDateString() + "<br>";
            finalMessage = finalMessage + "Message: " + message + "<br><br>";


            finalMessage = finalMessage + "Birthday Gift: " + birthdayGift + "<br>";
            finalMessage = finalMessage + "Birthday Plan: " + birthdayPlan;


            document.getElementById("daysBox").innerHTML = daysLeft;
            document.getElementById("result").innerHTML = finalMessage;


            // While Loop
            let day = 1;


            while (day <= 5) {
                countdownText = countdownText + "Countdown check " + day;
                countdownText = countdownText + ": Birthday excitement loading...<br>";
                day++;
            }


            document.getElementById("countdown").innerHTML = countdownText;
        }
    </script>

    <!-- Confetti Canvas and Script -->
    <canvas id="confettiCanvas" style="position:fixed;left:0;top:0;pointer-events:none;z-index:9999;"></canvas>
    <script>
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let W = window.innerWidth, H = window.innerHeight;
        canvas.width = W; canvas.height = H;

        window.addEventListener('resize', () => {
            W = window.innerWidth; H = window.innerHeight;
            canvas.width = W; canvas.height = H;
        });

        function makeConfetti(x, y) {
            const pieces = [];
            const colors = ['#ff477e', '#ffb3c6', '#ffd166', '#8bd3dd', '#72efdd', '#c77dff'];
            for (let i = 0; i < 120; i++) {
                pieces.push({
                    x: x,
                    y: y,
                    size: Math.random() * 8 + 4,
                    speedX: (Math.random() - 0.5) * 10,
                    speedY: (Math.random() - 1.5) * 10,
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: Math.random() * 90 + 60
                });
            }
            return pieces;
        }

        let confetti = [];

        function launchConfetti(cx, cy) {
            confetti = confetti.concat(makeConfetti(cx, cy));
            if (!animating) startAnimation();
        }

        let animating = false;
        function startAnimation() {
            animating = true;
            requestAnimationFrame(update);
        }

        function update() {
            ctx.clearRect(0, 0, W, H);
            for (let i = confetti.length - 1; i >= 0; i--) {
                const p = confetti[i];
                p.x += p.speedX;
                p.y += p.speedY;
                p.speedY += 0.35; // gravity
                p.rot += p.rotSpeed;
                p.life--;

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                ctx.restore();

                if (p.y > H + 50 || p.x < -50 || p.x > W + 50 || p.life <= 0) {
                    confetti.splice(i, 1);
                }
            }
            if (confetti.length > 0) requestAnimationFrame(update);
            else animating = false;
        }

        // Hook into button: override checkBirthday button to also trigger confetti
        const originalCheck = window.checkBirthday;
        window.checkBirthday = function () {
            // call original
            try { originalCheck(); } catch (e) { /* ignore */ }
            // get button position center
            const btn = document.querySelector('button[onclick="checkBirthday()"]');
            let rect = btn ? btn.getBoundingClientRect() : { left: W / 2, top: H / 2, width: 0, height: 0 };
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            launchConfetti(cx, cy);
        }
    </script>


</body>

</html>
