<!DOCTYPE html>
<html>

<head>
    <title>Module 2 CSS - Lesson 5 Box Model - My Animal Fact File</title>
    <style>
        /* Page background — sets the colour and font for the whole page */
        body {
            background-color: lightgreen;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        /* Box Model — width sets the content area
       padding pushes the text away from the edges
       border draws a visible frame around the fact file
       margin pushes the fact file away from the screen edge */
        .fact-file {
            background-color: lightyellow;
            color: darkslategrey;
            width: 500px;
            border: 4px solid forestgreen;
            margin: 15% auto;
            padding: 25px;
            text-align: center;
        }

        /* Animal name — forestgreen so it stands out */
        .animal-name {
            color: forestgreen;
            font-size: 22px;
            
        }

        /* Detail rows — dark text on the light background */
        .detail {
            color: darkslategrey;
            
        }

        /* Cool fact — orange and italic to make it feel special */
        .cool-fact {
            color: darkorange;
            font-style: italic;
        }

        a {
            color: #e65c00;
            font-size: 15px;
            border-radius: 8px;
            margin: 0 12px;
            padding: 8px 18px;
            border: 2px solid #e65c00;
            border-radius: 8px;
            text-decoration: none;
        }

        a:hover {
            color: #ffffff;
            background-color: #e65c00;
        }

        input.styled-input {
            padding: 8px 18px;
            border-radius: 8px;

        }

        .links {
            margin: 20px 0;
        }

    </style>
</head>

<body>

    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Lives in: Mountain ranges of Central Asia</p>
        <p class="detail">Diet: Deer, goats, and wild sheep</p>
        <p class="cool-fact">Cool Fact: Can leap up to 15 metres in one jump!</p>
        
        
    
    <div class="links">
        <a href="#">Order Now</a>
        <a href="#">See More</a>
    </div>
    <div><input type="text" class="styled-input" /></div>
</div>
</body>

</html>
